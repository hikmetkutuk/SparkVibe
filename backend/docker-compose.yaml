services:

  db:
    container_name: spark-vibe-db
    image: postgres:17.2
    environment:
      POSTGRES_USER: spark
      POSTGRES_PASSWORD: spark
      PGDATA: /data/postgres
    volumes:
      - ./data/db/:/data/postgres
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U spark -d spark-vibe" ]
      interval: 10s
      timeout: 5s
      retries: 5
  
  pgadmin:
    container_name: spark-vibe-pgadmin
    image: dpage/pgadmin4:8.14.0
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin4@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - data-pgadmin-service:/var/lib/pgadmin
    ports:
      - "5050:80"
    restart: unless-stopped
  
  elasticsearch:
    container_name: spark-vibe-elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - ./data/elasticsearch/:/usr/share/elasticsearch/data

  kibana:
    container_name: spark-vibe-kibana
    image: docker.elastic.co/kibana/kibana:8.13.4
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
  
  app:
    container_name: spark-vibe-app
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=spark-vibe;Username=spark;Password=spark
      - ASPNETCORE_URLS=http://+:8080
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  data-pgadmin-service: